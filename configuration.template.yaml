# ============================================================
# configuration.template.yaml
# ============================================================
# This file documents common configuration.yaml patterns used
# in a real Home Assistant setup. Copy and adapt the sections
# you need into your own configuration.yaml.
#
# IMPORTANT: Do NOT include this file directly with !include.
# It is a reference document, not a live config file.
# ============================================================

# --- Core includes ---
# Loads default set of integrations. Do not remove.
default_config:

frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# --- Friendly name overrides ---
# Use this section to give readable names to raw Zigbee entity IDs.
# Note: Renaming entities here does NOT rename the entity_id —
# use Settings → Entities in the UI for that.
homeassistant:
  external_url: "https://your-ha-instance.example.com"    # optional
  internal_url: "http://192.168.1.X:8123"                 # optional
  customize:
    sensor.your_energy_sensor_1:
      device_class: energy
      state_class: total_increasing
    sensor.your_power_sensor_1:
      device_class: power
      state_class: measurement

# --- Common input_boolean helpers ---
# These are global state flags used across many automations.
input_boolean:

  # Suppress TTS speech in all rooms while letting push/Telegram notifications proceed.
  quiet_tts_notifications:
    name: Quiet TTS Notifications
    icon: mdi:volume-off

  # Activate when guests are home to disable personal automations.
  guest_mode:
    name: Guest Mode
    icon: mdi:account-group

  # Track whether the kitchen tablet screen is awake.
  kitchen_tablet_screen_awake:
    name: Kitchen Tablet Screen Awake
    icon: mdi:tablet

  # Track whether the bathroom is occupied (used by motion + door automations).
  bathroom_occupied:
    name: Bathroom Occupied
    icon: mdi:human-male-female

  # TV timer state tracker.
  tv_timer_active:
    name: TV Timer Active
    icon: mdi:timer-check

  # Suppress all camera recordings, TTS, and notifications.
  privacy_mode:
    name: Privacy Mode
    icon: mdi:eye-off

  # Track whether a light was turned on by a "night auto" automation vs manually.
  kitchen_dish_light_started_by_night_auto:
    name: Kitchen Dish Light Started by Night Auto
    icon: mdi:lightbulb-on-outline

  # LED color mode: tracks whether a room's LED is in white vs RGB scene mode.
  bathroom_led_color_mode:
    name: Bathroom LED Color Mode
    icon: mdi:palette
  bedroom_led_color_mode:
    name: Bedroom LED Color Mode
    icon: mdi:palette

  # Kill-switch for motion-based automations (e.g., "I'm in bed, stop turning lights on from motion").
  bedroom_kill_motion_logic:
    name: Bedroom Kill Motion Logic
    icon: mdi:motion-sensor-off

  # Pause media playback after the current track finishes.
  pause_media_after_track:
    name: Pause Media After Current Track
    icon: mdi:pause-circle-outline

  # Flag for missed call alerts.
  missed_call_alert:
    name: Missed Call Alert
    icon: mdi:phone-missed

  # Thermostat overrides
  thermostat_boost_1h:
    name: Thermostat Boost 1h
    icon: mdi:fire
  thermostat_physical_override_fallback:
    name: Thermostat Physical Override Fallback
    icon: mdi:thermostat
    initial: true
  thermostat_night_mode:
    name: Thermostat Night Mode Active
    icon: mdi:weather-night

  # Indicates weekend-specific thermostat schedules have been reviewed and are ready to apply.
  thermostat_weekend_schedule_ready:
    name: Thermostat Weekend Schedule Ready
    icon: mdi:calendar-check

  # Media playback room toggles (used by Room: Media Playback automations).
  kitchen_media_playback:
    name: Kitchen Media Playback
    icon: mdi:play-circle
  child_room_media_playback:
    name: Child Room Media Playback
    icon: mdi:play-circle
  bedroom_media_playback:
    name: Bedroom Media Playback
    icon: mdi:play-circle

# --- Dashboard trigger buttons ---
input_button:
  tv_start_timer:
    name: Start TV Timer
    icon: mdi:play-circle
  missed_call_alert:
    name: Trigger Missed Call Alert
    icon: mdi:phone-missed

# --- Thermostat schedule helpers ---
