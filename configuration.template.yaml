    has_date: false
    has_time: true
  thermostat_schedule_time_2:
    name: Thermostat Schedule Day Time
    has_date: false
    has_time: true
  thermostat_schedule_time_3:
    name: Thermostat Schedule Evening Time
    has_date: false
    has_time: true
  thermostat_schedule_time_4:
    name: Thermostat Schedule Night Time
    has_date: false
    has_time: true
  # Saturday schedule
  thermostat_schedule_saturday_time_1:
    name: Thermostat Saturday Morning Time
    has_date: false
    has_time: true
  thermostat_schedule_saturday_time_2:
    name: Thermostat Saturday Day Time
    has_date: false
    has_time: true
  thermostat_schedule_saturday_time_3:
    name: Thermostat Saturday Evening Time
    has_date: false
    has_time: true
  thermostat_schedule_saturday_time_4:
    name: Thermostat Saturday Night Time
    has_date: false
    has_time: true
  # Sunday schedule
  thermostat_schedule_sunday_time_1:
    name: Thermostat Sunday Morning Time
    has_date: false
    has_time: true
  thermostat_schedule_sunday_time_2:
    name: Thermostat Sunday Day Time
    has_date: false
    has_time: true
  thermostat_schedule_sunday_time_3:
    name: Thermostat Sunday Evening Time
    has_date: false
    has_time: true
  thermostat_schedule_sunday_time_4:
    name: Thermostat Sunday Night Time
    has_date: false
    has_time: true

input_number:
  # TV timer
  tv_timer_minutes:
    name: TV Off Timer (minutes)
    min: 1
    max: 180
    step: 1
    unit_of_measurement: min
    icon: mdi:timer
    mode: box

  # TV daily usage accumulator (incremented by automation, reset at midnight)
  tv_daily_minutes_counter:
    name: TV Daily Minutes
    min: 0
    max: 1440
    step: 1
    unit_of_measurement: min
    icon: mdi:television

  # Thermostat schedule temperatures — Weekday
  thermostat_schedule_temp_1:
    name: Thermostat Morning Temperature
    min: 15
    max: 30
    step: 1
    unit_of_measurement: °C
    icon: mdi:thermometer
  thermostat_schedule_temp_2:
    name: Thermostat Day Temperature
    min: 15
    max: 30
    step: 1
    unit_of_measurement: °C
    icon: mdi:thermometer
  thermostat_schedule_temp_3:
    name: Thermostat Evening Temperature
    min: 15
    max: 30
    step: 1
    unit_of_measurement: °C
    icon: mdi:thermometer
  thermostat_schedule_temp_4:
    name: Thermostat Night Temperature
    min: 15
    max: 30
    step: 1
    unit_of_measurement: °C
    icon: mdi:thermometer
  thermostat_night_away_temp:
    name: Thermostat Night/Away Temperature
    min: 15
    max: 25
    step: 1
    unit_of_measurement: °C
    icon: mdi:home-export-outline
  # Saturday temperatures
  thermostat_schedule_saturday_temp_1:
    name: Thermostat Saturday Morning Temperature
    min: 15
    max: 30
    step: 1
    unit_of_measurement: °C
    icon: mdi:thermometer
  thermostat_schedule_saturday_temp_2:
    name: Thermostat Saturday Day Temperature
    min: 15
    max: 30
    step: 1
    unit_of_measurement: °C
    icon: mdi:thermometer
  thermostat_schedule_saturday_temp_3:
    name: Thermostat Saturday Evening Temperature
    min: 15
    max: 30
    step: 1
    unit_of_measurement: °C
    icon: mdi:thermometer
  thermostat_schedule_saturday_temp_4:
    name: Thermostat Saturday Night Temperature
    min: 15
    max: 30
    step: 1
    unit_of_measurement: °C
    icon: mdi:thermometer
  # Sunday temperatures
  thermostat_schedule_sunday_temp_1:
    name: Thermostat Sunday Morning Temperature
    min: 15
    max: 30
    step: 1
    unit_of_measurement: °C
    icon: mdi:thermometer
  thermostat_schedule_sunday_temp_2:
    name: Thermostat Sunday Day Temperature
    min: 15
    max: 30
    step: 1
    unit_of_measurement: °C
    icon: mdi:thermometer
  thermostat_schedule_sunday_temp_3:
    name: Thermostat Sunday Evening Temperature
    min: 15
    max: 30
    step: 1
    unit_of_measurement: °C
    icon: mdi:thermometer
  thermostat_schedule_sunday_temp_4:
    name: Thermostat Sunday Night Temperature
    min: 15
    max: 30
    step: 1
    unit_of_measurement: °C
    icon: mdi:thermometer

# --- AI model selector ---
# Allows switching between a local Ollama model and a cloud provider
# from the dashboard or an automation condition.
input_text:
  ai_ollama_model:
    name: "Ollama Model"
    initial: "your-model-nothink"
    icon: mdi:robot-outline
  ai_opencode_model:
    name: "OpenCode Model"
    initial: "your-cloud-model"
    icon: mdi:cloud-outline

  # Playlist name for media playback (used by playlist sync automation)
  media_playlist_name:
    name: "Playlist Name"
    initial: "your-playlist-name"
    icon: mdi:playlist-music

input_select:
  ai_provider_selector:
    name: AI Provider
    options:
      - "Local (Ollama)"
      - "Cloud (OpenCode)"
    initial: "Local (Ollama)"
    icon: mdi:robot

  # Fairy lights scene selector — choose a preset scene for controllable LED strips.
  # Add your own scene names to the options list.
  fairy_lights_scene_selector:
    name: Fairy Lights Scene
    options:
      - "Scene 1"
      - "Scene 2"
      - "Scene 3"
      - "Scene 4"
    initial: "Scene 1"
    icon: mdi:string-lights

# --- TV Off Timer ---
timer:
  tv_off_timer:
    name: TV Off Timer
    icon: mdi:television

  # Bedroom kill-motion timer — disables motion detection for 2 hours when triggered.
  bedroom_kill_motion_2h:
    name: Bedroom Kill Motion (2h)
    icon: mdi:motion-sensor-off
    duration: "02:00:00"

# --- Shell commands ---
shell_command:
  # Reset Bluetooth adapter if devices stop connecting.
  reset_bluetooth: >
    echo "power off" | bluetoothctl && sleep 2 && echo "power on" | bluetoothctl && sleep 2 && echo "scan on" | bluetoothctl

  # Generate an M3U playlist from a directory of audio files.
  # Requires python_scripts/create_playlist.py.
  create_playlist: >
    python3 /config/python_scripts/create_playlist.py /config/<your_audio_directory> /config/www/playlist.m3u

# --- Recorder optimizations ---
# Exclude high-churn, low-value entities from history to reduce DB size.
recorder:
  purge_keep_days: 7
  auto_purge: true
  commit_interval: 30
  exclude:
    domains:
      - automation
      - updater
      - persistent_notification
    entities:
      - sensor.time
      - sensor.date
      - sensor.date_time
    entity_globs:
      - sensor.last_boot*
      - sensor.date*
      - sensor.time*

# --- Template sensors ---
template:

  # Master house occupancy — combines presence helpers, guest mode, and
  # any area-based presence tracking (e.g., Magic Areas).
  - binary_sensor:
      - name: "House Occupied"
        unique_id: "house_occupied_master"
        device_class: occupancy
        icon: mdi:home-account
        state: >
          {{
            is_state('input_boolean.owner_1_home_stable', 'on') or
            is_state('input_boolean.guest_mode', 'on') or
            is_state('binary_sensor.magic_areas_presence_tracking_interior_area_state', 'on')
          }}

  # Wh → kWh conversion for two energy monitoring circuits.
  # unique_id is required for Long-Term Statistics.
  - sensor:
      - name: "Total House Energy kWh"
        unique_id: "total_house_energy_kwh"
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: >
          {{ ((states('sensor.energy_circuit_1') | float(0) +
               states('sensor.energy_circuit_2') | float(0)) / 1000) | round(3) }}

  # Calendar event detection — polls the Google/CalDAV calendar every minute
  # and exposes binary_sensor.events_today / events_tomorrow / events_this_week.
  - trigger:
      - platform: time_pattern
        minutes: "/1"
      - platform: homeassistant
        event: start
    action:
      - service: calendar.get_events
        data:
          start_date_time: "{{ now().strftime('%Y-%m-%d 00:00:00') }}"
          duration:
            days: 30
        target:
          entity_id: calendar.your_shared_calendar
        response_variable: agenda
    binary_sensor:
      - name: "Events Today"
        state: >
          {% set has_events = false %}
          {% if agenda is defined and 'calendar.your_shared_calendar' in agenda %}
            {% set events = agenda['calendar.your_shared_calendar'].events %}
            {% set ns = namespace(has_events=false) %}
            {% set today = now().date() %}
            {% for event in events %}
              {% set start_str = event.start %}
              {% if 'T' in start_str %}
                {% set dt = as_datetime(start_str) | as_local %}
              {% else %}
                {% set dt = (start_str ~ 'T00:00:00Z') | as_datetime | as_local %}
              {% endif %}
              {% if dt.date() == today %}
                {% set ns.has_events = true %}
              {% endif %}
            {% endfor %}
            {% set has_events = ns.has_events %}
          {% endif %}
          {{ has_events }}

  # TV daily usage tracker — accumulates minutes while TV is on.
  # Incremented every minute by "TV: Track Daily Usage" automation.
  # Reset at midnight by "TV: Reset Daily Usage" automation.
  - sensor:
      - name: "TV Daily Usage"
        unique_id: "tv_daily_usage_minutes"
        state: "{{ states('input_number.tv_daily_minutes_counter') | int(0) }}"
        unit_of_measurement: "min"
        icon: mdi:calendar-clock

# --- Local AI via Ollama ---
# Replace <your_ollama_host> with the LAN IP of your Ollama server.
rest_command:
  ollama_generate:
    url: "http://<your_ollama_host>:11434/api/generate"
    method: POST
    timeout: 60
    headers:
      Content-Type: "application/json"
    payload: >
      {
        "model": "{{ states('input_text.ai_ollama_model') }}",
        "prompt": {{ prompt | to_json }},
        "stream": false,
        "think": false,
        "options": {
          "num_predict": 500,
          "temperature": 0.9
        }
      }

# --- Powercalc examples ---
# Powercalc estimates power consumption for devices without built-in power meters.
# Integration: https://github.com/bramstroker/homeassistant-powercalc
powercalc:
  discovery:
    enabled: true
  sensors:
    # Fixed wattage for a light strip (measure with a smart plug to calibrate).
    - entity_id: light.kitchen_led_strip
      fixed:
        states_power:
          "off": 0.0
          "on": 10.0
    # Speaker with standby/idle/playing states.
    - entity_id: media_player.<your_kitchen_speaker>
      fixed:
        states_power:
          "off": 0.5
          "idle": 1.5
          "playing": 3.0
    # Dimmable LED light with linear power curve.
    - entity_id: light.bedroom_led
      linear:
        min_power: 1.0
        max_power: 12.0
