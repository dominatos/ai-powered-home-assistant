  # ════════════════════════════════════════════════════════════════
  # VIEW 7: CALENDAR
  # Full-panel family calendar view rendered via Jinja2 template.
  # Groups events into: Today, Tomorrow, This Week, Remaining Days.
  # Driven by sensor.google_calendar_agenda + System: Sync Family Calendar Hourly.
  # ════════════════════════════════════════════════════════════════
  - title: Calendar
    path: calendar
    icon: mdi:calendar-month
    panel: true
    cards:
      # ── FAMILY CALENDAR TEMPLATE ──
      # Parses event.start as datetime (timed) or date (all-day).
      # Sections: Today / Tomorrow / This Week (Mon–Sun) / Remaining 30 days.
      - type: markdown
        title: 📅 Family Calendar
        content: >
          {% set events = state_attr('sensor.google_calendar_agenda', 'events')
          %} {% if events == none %}
            No upcoming events or sensor is loading.
          {% else %}
            {% set today = now().date() %}
            {% set tomorrow = today + timedelta(days=1) %}
            {% set end_of_week = today + timedelta(days=6 - today.weekday()) %}
            {% set next_month = today + timedelta(days=30) %}
            
            {% set ns = namespace(today=[], tomorrow=[], week=[], month=[]) %}
            
            {% for event in events %}
              {% set start_str = event.start %}
              {% if 'T' in start_str %}
                {% set dt = as_datetime(start_str) | as_local %}
                {% set event_date = dt.date() %}
                {% set display = dt.strftime('%H:%M') ~ ' - ' ~ event.summary %}
              {% else %}
                {% set dt = (start_str ~ 'T00:00:00Z') | as_datetime | as_local %}
                {% set event_date = dt.date() %}
                {% set display = 'All Day - ' ~ event.summary %}
              {% endif %}
              
              {% if event_date == today %}
                {% set ns.today = ns.today + [display] %}
              {% elif event_date == tomorrow %}
                {% set ns.tomorrow = ns.tomorrow + [display] %}
              {% elif event_date > tomorrow and event_date <= end_of_week %}
                {% set ns.week = ns.week + [event_date.strftime('%a, %d %b') ~ ': ' ~ display] %}
              {% elif event_date > end_of_week and event_date <= next_month %}
                {% set ns.month = ns.month + [event_date.strftime('%d %b') ~ ': ' ~ display] %}
              {% endif %}
            {% endfor %}
            
            {% if ns.today | length > 0 %}
            <strong>Today</strong>
            {% for e in ns.today %}
            <p>• {{ e }}</p>
            {% endfor %}
            {% endif %}
            
            {% if ns.tomorrow | length > 0 %}
            <strong>Tomorrow</strong>
            {% for e in ns.tomorrow %}
            <p>• {{ e }}</p>
            {% endfor %}
            {% endif %}
            
            {% if ns.week | length > 0 %}
            <strong>This Week</strong>
            {% for e in ns.week %}
            <p>• {{ e }}</p>
            {% endfor %}
            {% endif %}
            
            {% if ns.month | length > 0 %}
            <strong>Remaining Days</strong>
            {% for e in ns.month %}
            <p>• {{ e }}</p>
            {% endfor %}
            {% endif %}
            
            {% if ns.today|length == 0 and ns.tomorrow|length == 0 and ns.week|length == 0 and ns.month|length == 0 %}
            <p>No upcoming events in the next 30 days!</p>
            {% endif %}
          {% endif %}
        card_mod:
          style:
            ha-markdown $: |
              p {
                font-size: 24px !important;
                line-height: 1.4 !important;
                margin-bottom: 5px !important;
                margin-top: 5px !important;
              }
              strong {
                font-size: 32px !important;
                color: #ffb74d !important;
                display: block !important;
                margin-top: 20px !important;
                margin-bottom: 10px !important;
                border-bottom: 2px solid #ffb74d !important;
                padding-bottom: 5px !important;
              }

  # ════════════════════════════════════════════════════════════════
  # VIEW 8: ENERGY INFRASTRUCTURE
  # Historical energy consumption data for all monitored circuits
  # and smart plugs.
  # DIN 10A = lights & light-load circuit
  # DIN 16A = heavy kitchen appliances circuit
  # Energy entities (kWh) were enabled 2026-07-03; history starts
  # from that date. Power sensors were always active.
  # ════════════════════════════════════════════════════════════════
  - title: Energy
    path: energy_infrastructure
    icon: mdi:lightning-bolt
    cards:

      # ── MONTHLY CONSUMPTION (COMBINED) ──
      - type: statistics-graph
        title: 📅 Monthly Consumption (Last 12 Months)
        chart_type: bar
        period: month
        days_to_show: 365
        stat_types:
          - change
        entities:
          - entity: sensor.total_house_energy_kwh
            name: Total House (kWh)

      # ── MAINS: DIN RAIL CIRCUIT MONITORS ──
      # Two Tongou TO-Q-SY1-JWT DIN rail breakers on the main panel.
      # DIN 10A: lights and light-load circuits.
      # DIN 16A: heavy kitchen appliances (oven, washing machine, etc.).
      # Total House Power is a min_max helper summing both circuits.
      - type: entities
        title: ⚡ Mains — Circuit Monitors
        show_header_toggle: false
        entities:
          - entity: sensor.total_house_power
            name: Total House Power
            icon: mdi:home-lightning-bolt
            secondary_info: last-updated
          - type: divider
          - type: section
            label: "💡 DIN 10A — Lights & Light Loads"
          - entity: sensor.energy_monitoring_din_10a_power
            name: Power
            icon: mdi:flash
          - entity: sensor.energy_monitoring_din_10a_current
            name: Current
            icon: mdi:current-ac
          - entity: sensor.energy_monitoring_din_10a_voltage
            name: Voltage
            icon: mdi:sine-wave
          - entity: sensor.energy_monitoring_din_10a_energy
            name: Total Energy (kWh)
            icon: mdi:counter
          - type: section
            label: "🔥 DIN 16A — Heavy Kitchen Appliances"
          - entity: sensor.energy_monitoring_din_16a_power
            name: Power
            icon: mdi:flash
          - entity: sensor.energy_monitoring_din_16a_current
            name: Current
            icon: mdi:current-ac
          - entity: sensor.energy_monitoring_din_16a_voltage
            name: Voltage
            icon: mdi:sine-wave
          - entity: sensor.energy_monitoring_din_16a_energy
            name: Total Energy (kWh)
            icon: mdi:counter

      # ── MAINS: POWER HISTORY (24h) ──
      - type: history-graph
        title: ⚡ Mains Power History (24h)
        hours_to_show: 24
        entities:
          - entity: sensor.total_house_power
            name: Total House
          - entity: sensor.energy_monitoring_din_10a_power
            name: DIN 10A — Lights
          - entity: sensor.energy_monitoring_din_16a_power
            name: DIN 16A — Heavy

      # ── SMART PLUGS: LIVE POWER DRAW ──
      # All 6 Zigbee smart plugs with power monitoring (always active).
      # - type: entities
      #   title: 🔌 Smart Plugs — Live Power
      #   show_header_toggle: false
      #   entities:
      #     - entity: sensor.<zigbee_mac_address>_power
      #       name: Oven (Forno)
      #       icon: mdi:stove
      #     - entity: sensor.<zigbee_mac_address>_power
      #       name: Washing Machine
      #       icon: mdi:washing-machine
      #     - entity: sensor.<zigbee_mac_address>_power
      #       name: Dehumidifier
      #       icon: mdi:air-humidifier
      #     - entity: sensor.<zigbee_mac_address>_power
      #       name: Fan (Ventilatore)
      #       icon: mdi:fan
      #     - entity: sensor.<zigbee_mac_address>_power
      #       name: Sun Lamp
      #       icon: mdi:lamp
      #     - entity: sensor.<zigbee_mac_address>_power
      #       name: Notebook Charger
      #       icon: mdi:laptop

      # ── SMART PLUGS: CUMULATIVE ENERGY ──
      # kWh counters — lifetime totals since the plug was paired.
      # - type: entities
      #   title: 📊 Smart Plugs — Cumulative Energy (kWh)
      #   show_header_toggle: false
      #   entities:
      #     - entity: sensor.<zigbee_mac_address>_energy
      #       name: Oven (Forno)
      #       icon: mdi:stove
      #     - entity: sensor.<zigbee_mac_address>_energy
      #       name: Washing Machine
      #       icon: mdi:washing-machine
      #     - entity: sensor.<zigbee_mac_address>_energy
      #       name: Dehumidifier
      #       icon: mdi:air-humidifier
      #     - entity: sensor.<zigbee_mac_address>_energy
      #       name: Fan (Ventilatore)
      #       icon: mdi:fan
      #     - entity: sensor.<zigbee_mac_address>_energy
      #       name: Sun Lamp
      #       icon: mdi:lamp
      #     - entity: sensor.<zigbee_mac_address>_energy
      #       name: Notebook Charger
      #       icon: mdi:laptop

      # ── HEAVY CONSUMERS: POWER HISTORY (24h) ──
      - type: history-graph
        title: 🏋️ Heavy Consumers — Power History (24h)
        hours_to_show: 24
        entities:
          - entity: sensor.<zigbee_mac_address_6>_power
            name: Oven
          - entity: sensor.<zigbee_mac_address_7>_power
            name: Washing Machine
          - entity: sensor.<zigbee_mac_address_8>_power
            name: Dehumidifier

      # ── LIGHT CONSUMERS: POWER HISTORY (24h) ──
      - type: history-graph
        title: 💡 Light Consumers — Power History (24h)
        hours_to_show: 24
        entities:
          - entity: sensor.<zigbee_mac_address_9>_power
            name: Fan
          - entity: sensor.<zigbee_mac_address_10>_power
            name: Sun Lamp
          - entity: sensor.<zigbee_mac_address_11>_power
            name: Notebook Charger

      # ── OTHER MONITORED DEVICES ──
      # Samsung Fridge (SmartThings) — power and energy are hidden
      # in the registry but functional; included here for completeness.
      # A/C (hOn) — power only, no energy accumulator available.
      # - type: entities
      #   title: 🧊 Other Monitored Devices
      #   show_header_toggle: false
      #   entities:
