      #     - entity: sensor.air_conditioner_power
      #       name: A/C — Power
      #       icon: mdi:air-conditioner

  # ════════════════════════════════════════════════════════════════
  # VIEW 9: TABLET
  # Kitchen wall-mounted tablet (<tablet_hostname>) management.
  # Screen wake/sleep, app control, battery monitoring,
  # and notebook charger smart plug.
  # Entities controlled here are also referenced by:
  #   - Kitchen: Kitchen Tablet: Screen Control via Motion
  #   - Kitchen: Main Light on Door Open (tablet wake sequence)
  #   - House: All Lights Off (tablet sleep + boolean reset)
  # ════════════════════════════════════════════════════════════════
  - title: Tablet
    path: tablet
    icon: mdi:tablet-dashboard
    cards:

      # ── SCREEN CONTROL ──
      # Quick wake/sleep buttons side by side.
      # These mirror the button presses sent by the motion automation.
      - type: grid
        title: 🖥️ Screen Control
        columns: 2
        square: false
        cards:
          - type: button
            entity: button.<tablet_hostname>_monitorwake
            name: Wake Screen
            icon: mdi:monitor-eye
            icon_height: 40px
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.<tablet_hostname>_monitorwake
          - type: button
            entity: button.<tablet_hostname>_monitorsleep
            name: Sleep Screen
            icon: mdi:monitor-off
            icon_height: 40px
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.<tablet_hostname>_monitorsleep

      # ── APP CONTROL ──
      # Dashboard webview focus, lock-screen dismiss, and HASS.Agent restart.
      # multiplekeys sends the "Up" key to dismiss the Windows lock screen
      # after a wake so the HA dashboard is immediately visible.
      - type: grid
        title: 📲 App Control
        columns: 3
        square: false
        cards:
          - type: button
            entity: button.<tablet_hostname>_webview
            name: Open Dashboard
            icon: mdi:open-in-app
            icon_height: 40px
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.<tablet_hostname>_webview
          - type: button
            entity: button.<tablet_hostname>_multiplekeys
            name: Dismiss Lock
            icon: mdi:lock-open-variant
            icon_height: 40px
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.<tablet_hostname>_multiplekeys
          - type: button
            entity: button.<tablet_hostname>_restart
            name: Restart Agent
            icon: mdi:restart
            icon_height: 40px
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.<tablet_hostname>_restart

      # ── BATTERY & STATUS ──
      # Gauge shows battery level prominently (green 40–100 %, yellow 20–40 %, red 0–20 %).
      # Glance shows charge status, screen-state boolean, and active window at a glance.
      - type: gauge
        entity: sensor.<tablet_hostname>_battery_charge_remaining_percentage
        name: 🔋 Tablet Battery
        unit: "%"
        needle: true
        min: 0
        max: 100
        severity:
          green: 40
          yellow: 20
          red: 0

      - type: glance
        title: 📊 Tablet Status
        show_state: true
        entities:
          - entity: sensor.<tablet_hostname>_battery_charge_status
            name: Charge
            icon: mdi:battery-charging
          - entity: input_boolean.kitchen_tablet_screen_awake
            name: Screen
            icon: mdi:tablet
          - entity: sensor.<tablet_hostname>_activewindow
            name: Window
            icon: mdi:monitor

      # ── NOTEBOOK CHARGER ──
      # Zigbee smart plug (switch.notebook_charger) for the laptop charger.
      # Separate device from the tablet hardware — managed by charging automations.
      - type: entities
        title: 💻 Notebook Charger
        show_header_toggle: false
        entities:
          - entity: switch.notebook_charger
            name: Charger Switch
            icon: mdi:laptop
          - entity: number.notebook_charger_countdown
            name: Auto-Off Countdown
            icon: mdi:timer-outline

  # ════════════════════════════════════════════════════════════════
  # VIEW 7: TV REMOTE
  # Dedicated physical-style remote for the Kitchen IR TV.
  # ════════════════════════════════════════════════════════════════
  - title: TV Remote
    path: tv-remote
    icon: mdi:remote-tv
    cards:
      - type: vertical-stack
        cards:
          - type: markdown
            content: >
              <div style="text-align: center;">
              <h2>Kitchen TV Remote</h2>
              </div>

          # ── Two-column layout: Remote (left) + Timer (right) ──
          - type: grid
            columns: 2
            square: false
            cards:
              # ══════════════════════════════════════════════════════════
              # LEFT: Remote buttons
              # ══════════════════════════════════════════════════════════
              - type: vertical-stack
                cards:
                  # Power and Input
                  - type: grid
                    columns: 3
                    square: false
                    cards:
                      - type: button
                        entity: button.<your_tv_ir_remote>_turn_on
                        tap_action:
                          action: call-service
                          service: button.press
                          target:
                            entity_id: button.<your_tv_ir_remote>_turn_on
                        name: Power On
                        icon: mdi:power
                      - type: button
                        entity: button.<your_tv_ir_remote>_turn_off
                        tap_action:
                          action: call-service
                          service: button.press
                          target:
                            entity_id: button.<your_tv_ir_remote>_turn_off
                        name: Power Off
                        icon: mdi:power-off
                      - type: button
                        entity: button.<your_tv_ir_remote>_input_source_switch
                        tap_action:
                          action: call-service
                          service: button.press
                          target:
                            entity_id: button.<your_tv_ir_remote>_input_source_switch
                        name: Input
                        icon: mdi:video-input-hdmi

                  # Volume and Channel Controls
                  - type: grid
                    columns: 2
                    square: false
                    cards:
                      - type: grid
                        columns: 1
                        square: false
                        cards:
                          - type: button
                            entity: button.<your_tv_ir_remote>_volume_up
                            tap_action:
                              action: call-service
                              service: button.press
                              target:
                                entity_id: button.<your_tv_ir_remote>_volume_up
                            name: Vol +
                            icon: mdi:plus
                          - type: button
                            entity: button.<your_tv_ir_remote>_volume_down
                            tap_action:
                              action: call-service
                              service: button.press
                              target:
                                entity_id: button.<your_tv_ir_remote>_volume_down
                            name: Vol -
                            icon: mdi:minus

                      - type: grid
                        columns: 1
                        square: false
                        cards:
                          - type: button
                            entity: button.<your_tv_ir_remote>_channel_up
                            tap_action:
                              action: call-service
                              service: button.press
                              target:
                                entity_id: button.<your_tv_ir_remote>_channel_up
                            name: Ch +
                            icon: mdi:chevron-up
                          - type: button
                            entity: button.<your_tv_ir_remote>_channel_down
                            tap_action:
                              action: call-service
                              service: button.press
                              target:
                                entity_id: button.<your_tv_ir_remote>_channel_down
                            name: Ch -
                            icon: mdi:chevron-down

                  # Mute controls
                  - type: grid
                    columns: 2
                    square: false
                    cards:
                      - type: button
                        entity: button.<your_tv_ir_remote>_mute_on
                        tap_action:
                          action: call-service
                          service: button.press
                          target:
                            entity_id: button.<your_tv_ir_remote>_mute_on
                        name: Mute
                        icon: mdi:volume-mute
                      - type: button
                        entity: button.<your_tv_ir_remote>_mute_off
                        tap_action:
                          action: call-service
                          service: button.press
                          target:
                            entity_id: button.<your_tv_ir_remote>_mute_off
                        name: Unmute
                        icon: mdi:volume-high

              # ══════════════════════════════════════════════════════════
              # RIGHT: Timer + Runtime counter
              # ══════════════════════════════════════════════════════════
              - type: vertical-stack
                cards:
                  # TV Off Timer
                  - type: markdown
                    content: >
                      <div style="text-align: center;">
                      <h3>TV Off Timer</h3>
                      </div>
                  - type: entity
                    entity: input_number.tv_timer_minutes
                    name: Minutes until TV turns off
                    icon: mdi:timer-cog-outline
                  - type: grid
                    columns: 3
                    square: false
                    cards:
                      - type: button
                        tap_action:
                          action: call-service
                          service: input_button.press
                          target:
                            entity_id: input_button.tv_start_timer
                        name: Start
                        icon: mdi:play
                        icon_height: 30px
                      - type: button
                        tap_action:
                          action: call-service
                          service: timer.pause
                          target:
                            entity_id: timer.tv_off_timer
                        name: Pause
                        icon: mdi:pause
                        icon_height: 30px
                      - type: button
                        tap_action:
                          action: call-service
                          service: timer.resume
                          target:
                            entity_id: timer.tv_off_timer
                        name: Resume
                        icon: mdi:play-pause
                        icon_height: 30px
                  - type: grid
                    columns: 2
                    square: false
                    cards:
                      - type: button
                        tap_action:
                          action: call-service
                          service: script.kitchen_tv_extend_timer
                        name: Extend
                        icon: mdi:timer-plus
                        icon_height: 30px
                      - type: button
                        tap_action:
                          action: call-service
                          service: timer.cancel
                          target:
                            entity_id: timer.tv_off_timer
                        name: Cancel
                        icon: mdi:stop
                        icon_height: 30px
                  - type: entity
                    entity: sensor.tv_timer_remaining
                    name: Time remaining
                    icon: mdi:timer-sand

                  # TV Runtime counter
                  - type: markdown
                    content: >
                      <div style="text-align: center;">
                      <h3>TV Runtime</h3>
                      </div>
                  - type: entity
                    entity: sensor.tv_runtime
                    name: TV has been on for
                    icon: mdi:clock-outline

                  # TV Daily Usage
                  - type: markdown
                    content: >
                      <div style="text-align: center;">
                      <h3>TV Daily Usage</h3>
                      </div>
                  - type: entity
                    entity: sensor.tv_daily_usage
                    name: Minutes today
                    icon: mdi:calendar-clock

  # ════════════════════════════════════════════════════════════════
  # VIEW 13: CAR
  # Dedicated vehicle view: location map, travel time, Google Maps link,
  # daily/total/weekly/monthly distance statistics, speed gauge & 24h graph,
  # Traccar diagnostics (car 12V supply voltage, tracker battery & status),
  # and vehicle automation toggles.
  # ════════════════════════════════════════════════════════════════
  - title: Car
    path: car
    icon: mdi:car
    cards:

      # ── LIVE MAP & LOCATION ──
      - type: vertical-stack
        cards:
          - type: map
            title: 🚗 Car 1 — Live Location
            entities:
              - entity: device_tracker.car_1
            default_zoom: 14
            hours_to_show: 24
            aspect_ratio: 16:9
            tap_action:
              action: more-info
              entity: device_tracker.car_1

          # Address & Location Banner
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.car_1_address
                name: Current Address
                icon: mdi:map-marker
              - entity: sensor.car_1_geofence
                name: Geofence Zone
                icon: mdi:fence
              - entity: sensor.time_to_home_car
                name: Travel Time to Home
                icon: mdi:clock-fast

          # Google Maps Link
          - type: markdown
            content: >
              <div style="text-align: center; padding: 6px;">
              <a href="https://www.google.com/maps?q={{ state_attr('device_tracker.car_1', 'latitude') }},{{ state_attr('device_tracker.car_1', 'longitude') }}" target="_blank" style="text-decoration: none; font-weight: bold; font-size: 16px; color: #4caf50;">🗺️ Open Location in Google Maps</a>
              </div>
            card_mod:
              style: |
                ha-card { background: rgba(76, 175, 80, 0.1); border: 1px solid rgba(76, 175, 80, 0.4); }

      # ── DISTANCE STATISTICS ──
      - type: grid
        title: 📈 Distance Statistics
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-entity-card
            entity: sensor.car_1_daily_distance
            name: Daily Distance
            icon: mdi:map-marker-distance
            icon_color: green
            secondary_info: last-changed
          - type: custom:mushroom-entity-card
            entity: sensor.car_1_total_distance
            name: Total Distance
            icon: mdi:counter
            icon_color: blue
            secondary_info: last-changed
          - type: custom:mushroom-entity-card
            entity: sensor.car_1_weekly_distance
            name: Weekly Distance
            icon: mdi:calendar-week
            icon_color: orange
            secondary_info: last-changed
          - type: custom:mushroom-entity-card
            entity: sensor.car_1_monthly_distance
            name: Monthly Distance
            icon: mdi:calendar-month
            icon_color: purple
            secondary_info: last-changed

      # ── SPEED & MOTION ──
      - type: grid
        title: 🏎️ Speed & Driving History
        columns: 2
        square: false
        cards:
          - type: gauge
            entity: sensor.car_1_speed
            name: Speed
            unit: km/h
            min: 0
            max: 160
            needle: true
            severity:
              green: 0
              yellow: 50
              red: 100
          - type: entities
            show_header_toggle: false
            entities:
              - entity: binary_sensor.car_1_motion
                name: Motion Status
                icon: mdi:car-connected
              - entity: binary_sensor.car_1_status
                name: Tracker Status
                icon: mdi:signal-cellular-3

      # Speed 24h History Graph
      - type: custom:mini-graph-card
        title: 📊 Speed History (24h)
        entities:
          - entity: sensor.car_1_speed
            name: Speed (km/h)
        hours_to_show: 24
        points_per_hour: 4
        show:
          fill: true
          graph: line
        line_color: '#2196f3'

      # ── VEHICLE HEALTH & TELEMETRY (TRACCAR) ──
      - type: entities
        title: 🔋 Vehicle Health & Diagnostics
        show_header_toggle: false
        entities:
          - entity: sensor.car_1_supply_voltage
            name: Car 12V Main Battery (Supply)
            icon: mdi:car-battery
          - entity: sensor.car_1_battery
            name: Tracker Internal Battery (%)
            icon: mdi:battery
          - entity: sensor.car_1_battery_voltage
            name: Tracker Internal Voltage
            icon: mdi:sine-wave
          - entity: sensor.car_1_altitude
            name: Elevation / Altitude
            icon: mdi:elevation-rise

      # Low Car Battery Alert (Conditional)
      - type: conditional
        conditions:
          - condition: numeric_state
            entity: sensor.car_1_supply_voltage
            below: 11.8
        card:
          type: markdown
          content: |-
            ## ⚠️ LOW CAR BATTERY VOLTAGE
            Car main battery supply voltage is below **11.8 V**! Check vehicle battery to prevent failure to start.
          card_mod:
            style: |
              ha-card { background: #b71c1c !important; color: white; }

      # ── VEHICLE AUTOMATIONS ──
      - type: grid
        title: 🤖 Car Automations
        columns: 2
        square: false
        cards:
          - type: button
            entity: automation.presence_car_1_arrival_departure
            name: Arrival/Departure Alerts
