# dashboard.template.yaml
# =======================
# Legacy combined Lovelace dashboard template (superseded by basic/advanced split).
# Contains all views in a single file for reference.
# Rename to dashboard.yaml and fill in <device_id_here>, <tablet_hostname>, <zigbee_mac_address>, etc.
views:

  # ════════════════════════════════════════════════════════════════
  # VIEW 1: OVERVIEW
  # Main glanceable dashboard for the kitchen tablet.
  # Shows clock, calendar alerts, presence, weather, lights, A/C,
  # media, active appliances, power gauge, and safety alerts.
  # ════════════════════════════════════════════════════════════════
  - title: Overview
    path: overview
    icon: mdi:home
    cards:

      # ── CLOCK ──
      # Custom digital clock card — displayed at the top of Overview.
      # Scaled up via card_mod for wall-display readability.
      - type: custom:foundry-digital-clock-card
        size: large
        show_seconds: true
        theme: none
        themeentity: ""
        ring_style: silver
        font_bg_color: "#050510"
        font_color: "#00ff00"
        title_color: "#ffffff"
        rivet_color: "#2a2a35"
        plate_color: "#1c1c24"
        plate_transparent: true
        glass_effect_enabled: true
        aged_texture: none
        aged_texture_intensity: 0
        title_font_size: 14
        use_24h_format: true
        colors_typography:
          show_seconds: false
          use_24h_format: false
        wear_level: 5010
        card_mod:
          style: |
            ha-card {
              transform: scale(1.3);
              margin-top: 20px !important;
              margin-bottom: 20px !important;
            }

      # ── CALENDAR ALERTS ──
      # Shows colored alert banners when events exist today or tomorrow.
      # Each card is conditional — hidden if the binary sensor is off.
      # Driven by binary_sensor.events_today and binary_sensor.events_tomorrow.
      # events_this_week was disabled — sensor not yet configured.
      - type: horizontal-stack
        cards:
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.events_today
                state: "on"
            card:
              type: markdown
              content: |
                <div style="text-align: center; padding: 10px;">
                  <span style="font-size: 60px;">🔴📅</span><br>
                  <b style="font-size: 25px;">Events Today!</b>
                </div>
              card_mod:
                style: >
                  ha-card { background: rgba(255, 0, 0, 0.1); border: 2px solid
                  red; }
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.events_tomorrow
                state: "on"
            card:
              type: markdown
              content: |
                <div style="text-align: center; padding: 10px;">
                  <span style="font-size: 60px;">🟠📅</span><br>
                  <b style="font-size: 25px;">Events Tomorrow!</b>
                </div>
              card_mod:
                style: >
                  ha-card { background: rgba(255, 165, 0, 0.1); border: 2px
                  solid orange; }
          # Disabled: binary_sensor.events_this_week not yet created.
          # Uncomment when the sensor is configured.
          #- type: conditional
          #  conditions:
          #    - condition: state
          #      entity: binary_sensor.events_this_week
          #      state: "on"
          #  card:
          #    type: markdown
          #    content: |
          #      <div style="text-align: center; padding: 10px;">
          #        <span style="font-size: 60px;">🟡🗓️</span><br>
          #        <b style="font-size: 25px;">Events This Week</b>
          #      </div>
          #    card_mod:
          #      style: |
          #        ha-card { background: rgba(255, 255, 0, 0.1); border: 2px solid yellow; }

      # ── PEOPLE & PRESENCE ──
      # Person entity cards: hidden when home, clickable to open map (more-info).
      # ETA shown below via compact markdown when away.
      - type: horizontal-stack
        cards:
          - type: conditional
            conditions:
              - condition: state
                entity: person.person_1
                state_not: home
            card:
              type: vertical-stack
              cards:
                - type: entity
                  entity: person.person_1
                  name: Person 1
                  icon: mdi:account
                - type: markdown
                  content: >
                    <div style="text-align: center;">
                    <ha-icon icon="mdi:car"></ha-icon> ETA: {{ states('sensor.time_to_home_person_1') | float(0) | round(0) | int }}m
                    </div>
          - type: conditional
            conditions:
              - condition: state
                entity: person.person_2
                state_not: home
            card:
              type: vertical-stack
              cards:
                - type: entity
                  entity: person.person_2
                  name: Person 2
                  icon: mdi:account
                - type: markdown
                  content: >
                    <div style="text-align: center;">
                    <ha-icon icon="mdi:car"></ha-icon> ETA: {{ states('sensor.time_to_home_person_2') | float(0) | round(0) | int }}m
                    </div>

      # ── PERSON 2 LEFT WORK BANNER ──
      - type: conditional
        conditions:
          - condition: state
            entity: input_boolean.person_2_left_work
            state: "on"
          - condition: state
            entity: input_boolean.quiet_tts_notifications
            state: "on"
        card:
          type: markdown
          content: |
            <div style="text-align: center; padding: 20px;">
              <span style="font-size: 80px;">🚗👩</span><br>
              <b style="font-size: 32px;">Person 2 left work!</b><br>
              <span style="font-size: 26px;">
                <ha-icon icon="mdi:clock-outline"></ha-icon>
                ETA: {{ states('sensor.time_to_home_person_2') | float(0) | round(0) | int }}m
              </span>
            </div>
          card_mod:
            style: >
              ha-card { background: rgba(76, 175, 80, 0.2); border: 3px solid
              #4caf50; min-height: 120px; }

      # ── VEHICLE ──
      - type: conditional
        conditions:
          - condition: state
            entity: device_tracker.car_1
            state_not: home
        card:
          type: vertical-stack
          cards:
            - type: map
              title: 🚗 Vehicle
              entities:
                - entity: device_tracker.car_1
              default_zoom: 14
              hours_to_show: 24
              aspect_ratio: '16:9'
              tap_action:
                action: more-info
                entity: device_tracker.car_1
            # Speed row — only shown while the car is in motion
            - type: conditional
              conditions:
                - condition: state
                  entity: binary_sensor.car_1_motion
                  state: "on"
              card:
                type: markdown
                content: >
                  <div style="text-align: center;">
                  🚗 <b>{{ states('sensor.car_1_speed') | float(0) | round(0) | int }} km/h</b>
                  </div>
            - type: markdown
              content: >
                <div style="text-align: center;">
                <ha-icon icon="mdi:car"></ha-icon>
                ETA: {{ states('sensor.time_to_home_car') | float(0) | round(0) | int }}m
                </div>
            # Google Maps deep link — opens current car position in Google Maps
            - type: markdown
              content: >
                <div style="text-align: center;">
                <a href="https://www.google.com/maps?q={{ state_attr('device_tracker.car_1', 'latitude') }},{{ state_attr('device_tracker.car_1', 'longitude') }}">🗺️ Open in Google Maps</a>
                </div>

      # ── WEATHER ──
      - type: weather-forecast
        entity: weather.forecast_home
        show_forecast: true

      # ── OUTDOOR TEMPERATURE ──
      # Real-time outdoor reading from the A/C unit's external sensor.
      - type: entities
        show_header_toggle: false
        entities:
          - entity: sensor.air_conditioner_outdoor_temperature
            name: 🌡️ Outdoor Temperature (A/C sensor)
            icon: mdi:thermometer

      # ── THERMOSTAT QUICK CONTROL ──
      - type: conditional
        conditions:
          - condition: numeric_state
            entity: sensor.<device_id_here>_local_temperature
            below: 24
        card:
          type: entities
          show_header_toggle: false
          entities:
            - entity: climate.<device_id_here>
              name: Main Thermostat
            # - entity: input_boolean.thermostat_night_mode
            #   name: Night Mode Active

      # ── ROOMS AT A GLANCE ──
      # One-tap light toggle for all main rooms.
      - type: entities
        title: 💡 Rooms at a Glance
        show_header_toggle: false
        entities:
          - entity: light.<device_id_here_1>
            name: Kitchen
            icon: mdi:silverware-fork-knife
          - entity: light.<device_id_here_2>
            name: Bedroom
            icon: mdi:bed
          - entity: light.<device_id_here_3>
            name: Bathroom
            icon: mdi:shower
          - entity: light.<device_id_here_4>
            name: Child Room
            icon: mdi:teddy-bear

      # ── MAIN CONTROLS ──
      - type: grid
        title: 🎛️ Main Controls
        columns: 2
        square: false
        cards:
          - type: button
            entity: switch.<zigbee_mac_address>
            name: Oven (Forno)
            icon: mdi:stove
            icon_height: 40px
          - type: button
            entity: switch.<zigbee_mac_address>
            name: Fan (Ventilatore)
            icon: mdi:fan
            icon_height: 40px
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: sensor.<zigbee_mac_address>_local_temperature
                below: 22
              - condition: state
                entity: input_boolean.thermostat_boost_1h
                state: "off"
            card:
              type: button
              name: Thermostat Boost 22°C
              icon: mdi:thermometer-chevron-up
              tap_action:
                action: call-service
                service: input_boolean.turn_on
                target:
                  entity_id: input_boolean.thermostat_boost_1h
              icon_height: 40px
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: sensor.<zigbee_mac_address>_local_temperature
                above: 26
            card:
              type: button
              entity: input_boolean.bedroom_ac
              name: Bedroom A/C
              icon: mdi:air-conditioner
              icon_height: 40px
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: sensor.<zigbee_mac_address>_local_temperature
                above: 26
            card:
              type: button
              entity: input_boolean.kitchen_ac
              name: Kitchen A/C
              icon: mdi:air-conditioner
              icon_height: 40px
          - type: button
            entity: light.<your_kitchen_led_strip>
            name: LED Strip + Music
            icon: mdi:led-strip-variant
            icon_height: 40px
          - type: button
            name: All Lights Off
            icon: mdi:lightbulb-group-off
            tap_action:
              action: call-service
              service: script.turn_on
              target:
                entity_id: script.dashboard_all_lights_off
            icon_height: 40px
          - type: button
            entity: input_boolean.quiet_tts_notifications
            name: Quiet TTS
            icon: mdi:volume-off
            icon_height: 40px
            show_state: true

      # ── MEDIA ──
      # Dynamically discovers active media players.
      - type: custom:auto-entities
        card:
          type: entities
          title: 🎵 Media
          show_header_toggle: false
        filter:
          include:
            # 1. Any device actively playing, paused, or buffering
            - domain: media_player
              state: "playing"
            - domain: media_player
              state: "paused"
            - domain: media_player
              state: "buffering"
            # 2. Specific TVs that only report 'on' when active
            - entity_id: media_player.<your_tv>
              state: "on"
            - entity_id: media_player.<your_tv_2>
              state: "on"
          exclude:
            # Exclude known system/background media players
            - entity_id: "media_player.<your_jellyfin_user>"
            - entity_id: "media_player.<your_jellyfin_library_browser>"
        show_empty: false

      # ── ACTIVE APPLIANCES (conditional) ──
      # These cards are hidden when the appliances are idle.
      - type: conditional
        conditions:
          - condition: state
            entity: sensor.home_printer
            state_not: "unavailable"
          - condition: state
            entity: sensor.home_printer
            state_not: "unknown"
        card:
          type: entities
          title: 🖨️ Printer is Online
          entities:
            - entity: sensor.home_printer
              name: Home Printer
              icon: mdi:printer

      - type: conditional
        conditions:
          - condition: numeric_state
            entity: sensor.<zigbee_mac_address>_power
            above: 5
        card:
          type: entities
          title: 👕 Washing Machine is Running
          entities:
            - entity: sensor.<zigbee_mac_address>_power
              name: Power Draw
              icon: mdi:flash

      - type: conditional
        conditions:
          - condition: numeric_state
            entity: sensor.dish_washer_remaining_time
            above: 0
        card:
          type: entities
          title: 🍽️ Dishwasher is Running
          entities:
            - entity: sensor.dish_washer_remaining_time
              name: Remaining Time
              icon: mdi:timer-outline
            - entity: sensor.dish_washer_program_phase
              name: Phase
              icon: mdi:progress-clock

      # ── HOUSE POWER ──
      # Gauge: green 0–2000W, yellow 2000–2800W, red 2800W+.
      - type: gauge
        entity: sensor.total_house_power
        name: House Power
        unit: W
        severity:
          green: 0
          yellow: 2000
          red: 2800
        needle: true
        min: 0
        max: 5000

      # ── ACTIVE ALERTS (conditional) ──
      # Critical safety banners — only shown when a leak or gas alert is active.
      # Do NOT remove or disable these without adding an equivalent notification path.
      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.gas_sensor
            state: "on"
        card:
          type: markdown
          content: |-
            ## 🚨 GAS LEAK DETECTED
            The kitchen gas sensor has triggered!
          card_mod:
            style: |
              ha-card { background: #b71c1c !important; color: white; }

      - type: conditional
        conditions:
          - condition: numeric_state
            entity: sensor.total_house_power
            above: 3000
        card:
          type: markdown
          content: |-
            ## ⚡ HIGH POWER USAGE
            House power is above 3000W! Turn off some appliances to avoid a blackout.
          card_mod:
            style: |
              ha-card { background: #b71c1c !important; color: white; }

      - type: conditional
        conditions:
          - condition: or
            conditions:
              - condition: state
                entity: binary_sensor.<zigbee_mac_address_kitchen>_water_leak
                state: "on"
              - condition: state
                entity: binary_sensor.<zigbee_mac_address_bathroom_1>_water_leak
                state: "on"
              - condition: state
                entity: binary_sensor.<zigbee_mac_address_bathroom_2>_water_leak
                state: "on"
              - condition: state
                entity: binary_sensor.water_leak_bathroom_water_leak
                state: "on"
              - condition: state
                entity: binary_sensor.water_leak_child_water_leak
                state: "on"
        card:
          type: markdown
          content: |-
            ## 💧 WATER LEAK DETECTED
            Check leak sensors immediately!
          card_mod:
            style: |
              ha-card { background: #1565c0 !important; color: white; }

      # ── KITCHEN A/C DETECTION ALERT (conditional) ──
      # Mirrors the phone actionable notification from
      # "Kitchen: Detect manual A/C activation".
      # Appears when kitchen_temp_falling is on AND kitchen_ac is off AND
      # DIN 16A power is above 250 W (same three conditions as the automation).
      # Tapping the button marks input_boolean.kitchen_ac as on, which is the
      # same outcome as pressing "Yes, it is on" on the phone notification.
      # The card disappears automatically once kitchen_ac goes on.
      - type: conditional
        conditions:
          - condition: state
            entity: binary_sensor.kitchen_temp_falling
            state: "on"
          - condition: state
            entity: input_boolean.kitchen_ac
            state: "off"
          - condition: numeric_state
            entity: sensor.energy_monitoring_din_16a_power
            above: 250
        card:
          type: vertical-stack
          cards:
            - type: markdown
              content: |-
                ## ❄️ Is the Kitchen A/C on?
                Temperature is dropping and power draw is up.
                Tap below to mark it as running.
              card_mod:
                style: |
                  ha-card { background: rgba(33, 150, 243, 0.15); border: 2px solid #2196f3; }
            - type: button
              entity: input_boolean.kitchen_ac
              name: Yes — Mark Kitchen A/C as ON
              icon: mdi:air-conditioner
              icon_height: 40px
              tap_action:
                action: call-service
                service: input_boolean.turn_on
                target:
                  entity_id: input_boolean.kitchen_ac

  # ════════════════════════════════════════════════════════════════
  # VIEW 2: KITCHEN
  # Dedicated kitchen controls: lights, media, climate, sensors,
  # and appliances (oven + fan).
  # ════════════════════════════════════════════════════════════════
  - title: Kitchen
    path: kitchen
    icon: mdi:silverware-fork-knife
    cards:

      # ── LIGHTS ──
      - type: grid
        title: 💡 Lights
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-light-card
            entity: light.<zigbee_mac_address>
            name: Main Light
            icon: mdi:ceiling-light
            show_brightness_control: true
            show_color_temp_control: true
            use_light_color: true
          - type: custom:mushroom-light-card
            entity: light.<your_kitchen_dish_light>
            name: Dish Light
            icon: mdi:wall-sconce-flat
            show_brightness_control: true
          - type: custom:mushroom-light-card
            entity: light.<your_kitchen_led_strip>
            name: LED Strip + Music
            icon: mdi:led-strip-variant
            show_brightness_control: true
            show_color_temp_control: true
            use_light_color: true
          - type: custom:mushroom-light-card
            entity: light.fairy_lights
            name: Fairy Lights
            icon: mdi:string-lights
            show_brightness_control: true
            show_color_control: true
            use_light_color: true

      # ── FAIRY LIGHTS CONTROLS ──
      # Tuya Local text entities for scene/music/painting modes and timer.
      # These accept hex-encoded data strings via the Tuya Local integration.
      - type: entities
        title: ✨ Fairy Lights Controls
        show_header_toggle: false
        entities:
          - entity: input_select.fairy_lights_scene_selector
            name: Scene
          - type: button
            name: Next Scene
            icon: mdi:step-forward
            action_name: NEXT
            tap_action:
              action: call-service
              service: input_select.select_next
              target:
                entity_id: input_select.fairy_lights_scene_selector
            # - entity: text.fairy_lights_music
            #   name: Music Mode (Needs Hex Mapping)
            #   icon: mdi:music
            # - entity: text.fairy_lights_painting_control
            #   name: Painting Control (Needs Hex Mapping)
            #   icon: mdi:palette
          - entity: time.fairy_lights_timer
            name: Timer
            icon: mdi:timer-outline

      # ── MEDIA ──
      - type: conditional
        conditions:
          - condition: or
            conditions:
              - condition: state
                entity: media_player.<your_kitchen_speaker>
                state: "playing"
              - condition: state
                entity: media_player.<your_kitchen_speaker>
                state: "paused"
              - condition: state
                entity: media_player.<your_tv>
                state: "playing"
              - condition: state
                entity: media_player.<your_tv>
                state: "on"
        card:
          type: grid
          title: 🎵 Media
          columns: 2
          square: false
          cards:
            - type: conditional
              conditions:
                - condition: or
                  conditions:
                    - condition: state
                      entity: media_player.<your_kitchen_speaker>
                      state: "playing"
                    - condition: state
                      entity: media_player.<your_kitchen_speaker>
                      state: "paused"
              card:
                type: custom:mushroom-media-player-card
                entity: media_player.<your_kitchen_speaker>
                name: Kitchen Speaker
                icon: mdi:speaker
                use_media_info: true
                show_volume_level: true
                media_controls:
                  - play_pause_stop
                volume_controls:
                  - volume_buttons
            - type: conditional
              conditions:
                - condition: or
                  conditions:
                    - condition: state
                      entity: media_player.<your_tv>
                      state: "playing"
                    - condition: state
                      entity: media_player.<your_tv>
                      state: "on"
              card:
                type: custom:mushroom-media-player-card
                entity: media_player.<your_tv>
                name: Kitchen TV
                icon: mdi:television
                use_media_info: true
                show_volume_level: true
                media_controls:
                  - play_pause_stop
                volume_controls:
                  - volume_buttons

      # ── TV IR CONTROLS ──
      - type: grid
        title: 📺 TV IR Controls
        columns: 4
        square: true
        cards:
          - type: button
            entity: button.<your_tv_ir_remote>_turn_on
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.<your_tv_ir_remote>_turn_on
            name: TV On
            icon: mdi:power
            icon_height: 30px
          - type: button
            entity: button.<your_tv_ir_remote>_turn_off
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.<your_tv_ir_remote>_turn_off
            name: TV Off
            icon: mdi:power-off
            icon_height: 30px
          - type: button
            entity: button.<your_tv_ir_remote>_volume_down
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.<your_tv_ir_remote>_volume_down
            name: Vol -
            icon: mdi:volume-minus
            icon_height: 30px
          - type: button
            entity: button.<your_tv_ir_remote>_volume_up
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.<your_tv_ir_remote>_volume_up
            name: Vol +
            icon: mdi:volume-plus
            icon_height: 30px

      # ── CLIMATE ──
      # Temperature and humidity from kitchen Zigbee sensor.
      - type: grid
        title: ❄️ Climate
        columns: 2
        square: false
        cards:
          - type: button
            entity: input_boolean.kitchen_ac
            name: Kitchen A/C
            icon: mdi:air-conditioner
            icon_height: 40px
          - type: entities
            show_header_toggle: false
            entities:
              - entity: sensor.<zigbee_mac_address>_temperature
                name: Temp
                icon: mdi:thermometer
              - entity: sensor.<zigbee_mac_address>_humidity
                name: Humidity
                icon: mdi:water-percent

      # ── SENSORS ──
      # Motion, Door, Hood, Gas sensor glance view.
      - type: glance
        title: 📡 Sensors
        show_state: true
        entities:
          - entity: binary_sensor.<zigbee_mac_address_1>_occupancy
            name: Motion
          - entity: binary_sensor.<zigbee_mac_address_2>_contact
            name: Door
          - entity: binary_sensor.<zigbee_mac_address_3>_contact
            name: Hood
          - entity: binary_sensor.gas_sensor
            name: Gas

      # ── APPLIANCES ──
      # Forno and Ventilatore — linked by the fan-follows-oven automation.
      - type: grid
        title: 🔌 Appliances
        columns: 3
        square: false
        cards:
          - type: button
            entity: switch.<zigbee_mac_address>
            name: Oven (Forno)
            icon: mdi:stove
            icon_height: 40px
#          - type: button
#            entity: sensor.<zigbee_mac_address>_power
#            name: Oven Power
#            icon: mdi:flash
#            icon_height: 40px
#            show_state: true
          - type: button
            entity: switch.<zigbee_mac_address>
            name: Fan (Ventilatore)
            icon: mdi:fan
            icon_height: 40px

      # ── AUTOMATIONS ──
      - type: grid
        title: 🤖 Automations
        columns: 2
        square: false
        cards:
          - type: button
            name: Play Weather
            icon: mdi:weather-partly-cloudy
            icon_height: 40px
            tap_action:
              action: call-service
              service: automation.trigger
              target:
                entity_id: automation.weather_morning_alert
          - type: button
            name: Play Calendar
            icon: mdi:calendar-clock
            icon_height: 40px
            tap_action:
              action: call-service
              service: automation.trigger
              target:
                entity_id: automation.calendar_events_announcement
